[package]
name = "omnidev"
version = "0.1.0"
edition = "2024"
rust-version = "1.85"
description = "Track your code. Understand your growth."
license = "MIT"
readme = "README.md"
keywords = ["git", "analytics", "terminal", "developer", "statistics"]
categories = ["command-line-utilities", "development-tools"]

[lib]
name = "omnidev"
path = "src/lib.rs"

[[bin]]
name = "omnidev"
path = "src/main.rs"

[dependencies]
anyhow = "1"
chrono = { version = "0.4", default-features = false, features = ["clock", "std", "serde"] }
clap = { version = "4", features = ["derive"] }
comfy-table = "7"
crossterm = "0.28"
directories = "5"
git2 = { version = "0.19", default-features = false }
indicatif = "0.17"
owo-colors = "4"
ratatui = "0.29"
rusqlite = { version = "0.32", features = ["bundled"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"
toml = "0.8"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }

[dev-dependencies]
tempfile = "3"

[profile.release]
lto = "thin"
codegen-units = 1
strip = true
